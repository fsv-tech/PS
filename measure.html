<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW 14 -- measurement checklist</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:14px 16px; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.06em; }
  p.note { font-size:12px; color:#8b95a3; margin:0 0 12px; }
  table { border-collapse:collapse; width:100%; font:12px/1.5 Consolas, monospace; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid #1b232d; vertical-align:top; }
  th { color:#8b95a3; font-weight:600; }
  td.k { color:#c8ced8; white-space:nowrap; }
  td.src { color:#5c6672; }
  .no { color:#d08a7f; } .yes { color:#7fd0a0; }
  textarea { width:100%; height:150px; margin-top:14px; background:#0e1116;
             color:#c8ced8; border:1px solid #1e2732; font:12px/1.5 Consolas, monospace;
             padding:8px; box-sizing:border-box; }
</style>
</head>
<body>
<div id="wrap">
  <h1>14.00 MEASUREMENT CHECKLIST</h1>
  <p class="note">Fill each key from a real measurement, then paste the block into
     <code>fwtable.js</code> under <code>PS4["14.00"]</code>. The gate re-checks it on load.</p>
  <table id="tbl"><thead><tr><th>key</th><th>source</th><th>state</th></tr></thead><tbody></tbody></table>
  <textarea id="out" spellcheck="false" readonly></textarea>
</div>

<script type="module">
import { PS4, REQUIRED_KEYS, OPTIONAL_KEYS, KEY_SOURCE } from "./fwtable.js";
import { checkEntry, detectFirmware } from "./gate.js";

const entry = PS4["14.00"] || {};
const verdict = checkEntry(entry, REQUIRED_KEYS);
const fw = detectFirmware(navigator.userAgent);

const body = document.querySelector("#tbl tbody");
const keys = REQUIRED_KEYS.concat(OPTIONAL_KEYS);
for (const k of keys) {
  const have = entry[k] !== undefined && entry[k] !== null && entry[k] !== "";
  const tr = document.createElement("tr");
  tr.innerHTML = "<td class='k'>" + k + "</td>"
    + "<td class='src'>" + (KEY_SOURCE[k] || "") + "</td>"
    + "<td class='" + (have ? "yes" : "no") + "'>" + (have ? "set" : "empty") + "</td>";
  body.appendChild(tr);
}

const skeleton = { measured: true, fw_status: "state=MEASURED-ON-HW ..." };
for (const k of keys) skeleton[k] = entry[k] !== undefined ? entry[k] : null;
document.getElementById("out").value =
  "// detected: " + (fw.key || "unknown") + "  gate: " + verdict.state + "\n"
  + JSON.stringify(skeleton, null, 2);
</script>
</body>
</html>
